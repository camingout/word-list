{% extends 'base.html' %}

{% block content %}
<h1>{% block title %} Список унікальних слів {% endblock %}</h1>

<form method="post">
    <div class="form-group">
        <div id="result-text">
            {% for value in result %}
                {{ value }} <br />
            {% endfor %}
        </div>
    </div>

<div class="mb-3">
    <button type="button" id="copy-btn" class="btn btn-primary">Скопіювати результат</button>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Назад</a>
</div>

<script>
document.getElementById('copy-btn').addEventListener('click', function () {
    const btn = this;
    const text = document.getElementById('result-text').innerText.trim();

    navigator.clipboard.writeText(text).then(function () {
        const old = btn.textContent;
        btn.textContent = 'Скопійовано!';
        setTimeout(function () { btn.textContent = old; }, 1500);
    }).catch(function () {
        alert('Не вдалося скопіювати');
    });
});
</script>

{% endblock %}
