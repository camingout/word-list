{% extends "base.html" %}

{% block content %}
    <h2 class="h5 mt-3">{% block title %} Розділити текст {% endblock %}</h2>
<form action="{{ url_for('final') }}" method="post">
    <div class="form-group mb-2">
        <label for="split-content" class="mb-1">Текст, який потрібно розділити</label>
        <textarea name="content" id="split-content" class="form-control form-control-sm" rows="3"></textarea>
    </div>
    <div class="form-group mb-2">
        <label for="separator" class="mb-1">По чому розбити текст (за замовчуванням пробіл)</label>
        <input type="text" name="separator" id="separator" class="form-control form-control-sm" placeholder=",">
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Розділити текст</button>
</form>

<hr class="my-3">

<h2 class="h5">{% block title %} Прибрати переноси з тексту {% endblock %}</h2>
<form action="{{ url_for('join_text') }}" method="post">
    <div class="form-group mb-2">
        <label for="join-content" class="mb-1">Текст, з якого прибрати переноси</label>
        <textarea name="content" id="join-content" class="form-control form-control-sm" rows="3"></textarea>
    </div>
    <div class="form-group mb-2">
        <label for="glue" class="mb-1">Чим склеїти рядки (за замовчуванням пробіл)</label>
        <input type="text" name="glue" id="glue" class="form-control form-control-sm" placeholder=", ">
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Прибрати переноси</button>
</form>
    
{% endblock %}
