{% extends "base.html" %}

{% block content %}
<h1>{% block title %} Список унікальних слів {% endblock %}</h1>
<hr class="my-4"> Розділити текст <h2>
<form action="{{ url_for('final') }}" method="post">
    <div class="form-group">
        <label for="split-content">Текст, який потрібно розділити</label>
        <textarea name="content" id="split-content" class="form-control" rows="8"></textarea>
    </div>
    <div class="form-group">
        <label for="separator">По чому розбити текст (за замовчуванням пробіл)</label>
        <input type="text" name="separator" id="separator" class="form-control" placeholder=",">
    </div>
    <button type="submit" class="btn btn-primary">Розділити текст</button>
</form>
<hr class="my-4"> Прибрати переноси <h2>
    
<form action="{{ url_for('join_text') }}" method="post">
    <div class="form-group">
        <label for="join-content">Текст, з якого прибрати переноси</label>
        <textarea name="content" id="join-content" class="form-control" rows="8"></textarea>
    </div>
    <div class="form-group">
        <label for="glue">Чим склеїти рядки (за замовчуванням пробіл)</label>
        <input type="text" name="glue" id="glue" class="form-control" placeholder=", ">
    </div>
    <button type="submit" class="btn btn-primary">Прибрати переноси</button>
</form>
    
{% endblock %}
